name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: deja-two-beta
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
